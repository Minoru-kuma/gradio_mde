name: mde-unik3d
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.14
  - pip=25.0.1
  - setuptools=75.8.0
  - wheel=0.45.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.6.0+cpu
      - torchvision==0.21.0+cpu
      - numpy==2.2.2
      - pillow==11.1.0
      - opencv-python-headless==4.11.0.86
      - huggingface-hub==0.28.1
      - safetensors==0.5.3
      - einops==0.8.1
      - scipy==1.15.1
      - timm==1.0.14
      - wandb==0.19.6
      - matplotlib==3.10.0
# Native CPU path only. Install pinned source separately with --no-deps:
# git+https://github.com/lpiccinelli-eth/UniK3D@29f7862f3c3ee79c53ef0153dfc901ce511df575
# Native utils/__init__ imports wandb and matplotlib; no tracking is initialized.
# Gradio / GPU extensions and other full training extras are not part of this environment.
