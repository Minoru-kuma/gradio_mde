  - nodefaults
dependencies:
  - python=3.11.14
  - pip=25.0.1
  - setuptools=75.8.0
  - wheel=0.45.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.6.0+cpu
