[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mge-experiment-platform"
version = "0.1.0"
description = "Local subprocess experiments for monocular geometry and depth models"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mde = "mde.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
